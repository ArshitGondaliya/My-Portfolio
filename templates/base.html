{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arshit Gondaliya | Software Engineer{% endblock %}</title>
  <meta name="description" content="Arshit Gondaliya is a Python developer and data analytics enthusiast building practical web and machine learning solutions.">
  <meta name="keywords" content="Arshit Gondaliya, Python Developer, Software Engineer, Data Analyst, Django, Machine Learning">
  <meta property="og:title" content="Arshit Gondaliya | Software Engineer">
  <meta property="og:description" content="Python, web development, data analytics, and machine learning portfolio.">
  <meta property="og:type" content="website">
  <link rel="icon" href="{% static 'images/olive-suit.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="page-loader" aria-hidden="true"><span></span></div>
  <div class="scroll-progress" aria-hidden="true"></div>
  {% block content %}{% endblock %}
  <script src="{% static 'js/script.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
